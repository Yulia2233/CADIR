name: cadir

services:
  opencode:
    build:
      context: .
      dockerfile: docker/opencode-cad.Dockerfile
    restart: unless-stopped
    environment:
      CADIR_LLM_BASE_URL: ${CADIR_LLM_BASE_URL:-https://openrouter.icu/v1}
      CADIR_LLM_API_KEY: ${CADIR_LLM_API_KEY:?set CADIR_LLM_API_KEY in .env}
      CADIR_API_INTERNAL_URL: http://api:3000/internal
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?set OPENCODE_SERVER_PASSWORD in .env}
      CADIR_RUN_TIMEOUT_SECONDS: ${CADIR_RUN_TIMEOUT_SECONDS:-180}
      CADIR_JOBS_ROOT: /workspace/jobs
      CADIR_FREECAD_CMD: /usr/bin/freecadcmd
      OPENCODE_CONFIG: /app/opencode.json
      OPENCODE_CONFIG_DIR: /app/.opencode
    volumes:
      - cadir-jobs:/workspace/jobs
      - opencode-data:/home/cadir/.local/share/opencode
    expose:
      - "4096"
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3000
      CADIR_DATA_FILE: /data/cadir.json
      CADIR_JOBS_ROOT: /workspace/jobs
      CADIR_RAG_LIBRARY_ROOT: /workspace/rag-library
      CORS_ORIGIN: http://localhost:${CADIR_WEB_PORT:-5173}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
      OPENCODE_URL: http://opencode:4096
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?set OPENCODE_SERVER_PASSWORD in .env}
      OPENCODE_AGENT: cadir-agent
      OPENCODE_MODEL_PROVIDER: cadir
      CADIR_MODEL_ID: gpt-5.6-sol
    volumes:
      - cadir-data:/data
      - cadir-jobs:/workspace/jobs
      - cadir-rag-library:/workspace/rag-library
    ports:
      - "${CADIR_API_PORT:-3001}:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - "${CADIR_WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  cadir-data:
  cadir-jobs:
  cadir-rag-library:
  opencode-data:
